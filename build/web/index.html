<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="sholat_cuy">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>sholat_cuy</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script>
    // Web Audio and Notification Helper for SHOLAT cuy
    window.playNotificationSound = function(soundName) {
      try {
        let audioPath = '';
        if (soundName === 'adzan_1' || soundName === 'adzan_mekkah' || soundName.includes('adzan')) {
          audioPath = 'assets/assets/sounds/adzan_mekkah.mp3';
        } else if (soundName === 'beep') {
          audioPath = 'assets/assets/sounds/beep.mp3';
        } else {
          return;
        }
        let audio = new Audio(audioPath);
        audio.play().catch(e => console.log("Audio playback failed: ", e));
      } catch(e) {
        console.error(e);
      }
    };

    window.showWebNotification = function(title, body) {
      if (!("Notification" in window)) {
        return;
      }
      if (Notification.permission === "granted") {
        new Notification(title, { body: body, icon: 'favicon.png' });
      } else if (Notification.permission !== "denied") {
        Notification.requestPermission().then(function (permission) {
          if (permission === "granted") {
            new Notification(title, { body: body, icon: 'favicon.png' });
          }
        });
      }
    };
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
